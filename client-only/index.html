<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seedess client-only example</title>
    <style>
      body { margin: 0; background: #070b14; color: #eef4ff; font: 15px/1.6 -apple-system, sans-serif; }
      main { max-width: 860px; margin: 0 auto; padding: 48px 24px; }
      video { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; }
      code { color: #57d7ff; }
      pre { color: #8df0c8; }
    </style>
  </head>
  <body>
    <main>
      <h1>Seedess client-only example</h1>
      <p>
        A stream already exists. Replace <code>STREAM</code> and <code>TOKEN</code> with its
        id and <code>pk_…</code> token. No backend is involved.
      </p>
      <video id="video" controls playsinline></video>
      <pre id="stats"></pre>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script type="module">
      import { createPlayer } from 'https://seedess.com/p2p.js';

      const STREAM = 'demo';
      const TOKEN = 'pk_…';

      const player = await createPlayer(document.getElementById('video'), {
        stream: STREAM,
        token: TOKEN,
      });

      player.on('stats', (value) => {
        document.getElementById('stats').textContent = JSON.stringify(value, null, 2);
      });
    </script>
  </body>
</html>
